<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Our Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="chat-page">
    <div class="chat-container">
        <div class="chat-header">
            <span class="header-user" id="currentUser"></span>
            <div class="header-center">
                <span class="header-title">Our Chat</span>
                <span class="typing-indicator" id="typingIndicator"></span>
            </div>
            <div class="header-actions">
                <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle dark mode">&#9790;</button>
                <button class="switch-btn" onclick="switchUser()">Switch</button>
            </div>
        </div>

        <!-- Reply Preview -->
        <div class="reply-preview" id="replyPreview" style="display:none;">
            <div class="reply-bar-left"></div>
            <div class="reply-content">
                <span class="reply-name" id="replyName"></span>
                <span class="reply-text" id="replyText"></span>
            </div>
            <button class="reply-close" onclick="cancelReply()">✕</button>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="loading" id="loading">Loading messages...</div>
        </div>

        <div class="upload-progress" id="uploadProgress" style="display:none;">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-text" id="progressText">Uploading...</span>
        </div>

        <div class="input-area">
            <input type="file" id="fileInput" style="display:none" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.zip,.rar">
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">&#128206;</button>
            <button class="emoji-btn" id="emojiBtn" onclick="toggleEmojiPicker()" title="Emoji">&#128522;</button>
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">&#10148;</button>
        </div>

        <div class="input-area-2">
            <button class="mic-btn" id="micBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()" title="Hold to record voice">&#127908;</button>
        </div>

        <!-- Emoji Picker -->
        <div class="emoji-picker" id="emojiPicker" style="display:none;">
            <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <!-- Reaction Picker -->
        <div class="reaction-picker" id="reactionPicker" style="display:none;">
            <div class="reaction-quick">
                <button class="reaction-option" onclick="submitQuickReaction('❤️')">❤️</button>
                <button class="reaction-option" onclick="submitQuickReaction('😂')">😂</button>
                <button class="reaction-option" onclick="submitQuickReaction('🔥')">🔥</button>
                <button class="reaction-option" onclick="submitQuickReaction('👍')">👍</button>
                <button class="reaction-option" onclick="submitQuickReaction('😘')">😘</button>
                <button class="reaction-option" onclick="submitQuickReaction('😢')">😢</button>
                <button class="reaction-option reaction-more-btn" onclick="toggleEmojiGrid(event)">➕</button>
            </div>
            <div class="emoji-grid" id="reactEmojiGrid" style="display:none;"></div>
        </div>

        <!-- Context Menu -->
        <div class="context-menu" id="contextMenu" style="display:none;">
            <button class="context-item" onclick="copyMessageText()">&#128203; Copy</button>
            <button class="context-item" onclick="startReply()">&#128172; Reply</button>
            <button class="context-item" onclick="showReactionPicker()">&#128150; React</button>
        </div>

        <!-- Recording Indicator -->
        <div class="recording-indicator" id="recordingIndicator" style="display:none;">
            <span class="rec-dot"></span> Recording... <span id="recTimer">0:00</span> — Release to send
        </div>

        <!-- Toast -->
        <div class="toast" id="toast" style="display:none;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
