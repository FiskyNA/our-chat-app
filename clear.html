<!DOCTYPE html>
<html>
<head><title>Clearing Chat...</title></head>
<body>
<p id="status">Clearing all messages...</p>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
    apiKey: "AIzaSyDfOgdnm_-_YAhgpD-OLQO0z8tleYLzcNY",
    authDomain: "our-chat-10f48.firebaseapp.com",
    projectId: "our-chat-10f48"
});
const db = firebase.firestore();
db.collection('messages').get().then(snapshot => {
    const batch = db.batch();
    snapshot.forEach(doc => batch.delete(doc.ref));
    return batch.commit();
}).then(() => {
    document.getElementById('status').textContent = 'All messages cleared! You can close this tab.';
}).catch(err => {
    document.getElementById('status').textContent = 'Error: ' + err.message;
});
</script>
</body>
</html>
